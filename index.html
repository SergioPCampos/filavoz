<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#d7262e">
<title>FilaVoz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: balcão de atendimento — direto, grande, legível de longe
   IDEA: o painel de senhas de um posto de saúde
   PICTURE: o botão vermelho central e o nome chamado em letras enormes
   COLOUR and TYPE: branco, tinta quase preta, vermelho de sinal; Archivo
   LAYOUT: uma coluna de celular: chamado agora, botão, nova chegada, fila */
:root{color-scheme:light dark;--bg:light-dark(#f4f5f7,#0f1114);--card:light-dark(#fff,#1a1d22);--ink:light-dark(#14161a,#eef0f3);--mut:light-dark(#646a73,#9aa1ab);--line:light-dark(#e3e6ea,#2b3038);--red:#d7262e;--blue:#1f5fd6;--ok:#178a4c}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Archivo,system-ui,sans-serif;overflow-x:clip}
header{position:sticky;top:0;z-index:5;background:#14161a;color:#fff;display:flex;align-items:center;gap:10px;padding:10px max(4vw,14px)}
header b{font-size:20px;font-weight:900;flex:1}header b i{color:var(--red);font-style:normal}
.hb{background:#2a2e35;color:#fff;border:0;border-radius:10px;padding:0 12px;height:40px;font:600 14px Archivo,sans-serif;cursor:pointer}
main{max-width:560px;margin:0 auto;padding:14px 14px 60px;display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.lab{font-size:13px;font-weight:700;color:var(--mut);display:flex;justify-content:space-between;gap:8px;margin-bottom:6px}
#cur .tk{font-size:15px;font-weight:700;color:var(--red)}
#cur .nm{font-size:clamp(32px,10vw,50px);font-weight:900;line-height:1.05;text-wrap:balance;margin:2px 0 6px;overflow-wrap:anywhere}
#cur .meta{color:var(--mut);font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:700 15px Archivo,sans-serif;padding:0 14px;cursor:pointer}
.btn:focus-visible,.hb:focus-visible,#big:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{display:grid;place-items:center;padding:6px 0}
#big{width:min(68vw,250px);aspect-ratio:1;border-radius:50%;border:0;cursor:pointer;color:#fff;background:radial-gradient(circle at 35% 30%,#ff5b62,var(--red) 55%,#9e1219);box-shadow:0 14px 30px rgba(215,38,46,.4),inset 0 -8px 0 rgba(0,0,0,.18);font:900 clamp(24px,7vw,32px)/1.05 Archivo,sans-serif;display:grid;place-content:center;gap:8px;transition:transform .12s}
#big:active{transform:scale(.95)}#big.off{filter:grayscale(.75);opacity:.7}
#big small{font:700 14px Archivo,sans-serif;background:rgba(0,0,0,.25);border-radius:20px;padding:3px 10px;justify-self:center}
#mic{width:100%;height:64px;border:0;border-radius:14px;background:var(--blue);color:#fff;font:800 18px Archivo,sans-serif;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer}
#mic.on{background:var(--red);animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(215,38,46,.2)}}
@media(prefers-reduced-motion:reduce){#mic.on{animation:none}#big{transition:none}}
#heard{min-height:22px;font-size:15px;color:var(--mut);margin:8px 2px 0}
form{display:flex;gap:8px;margin-top:8px}
input{flex:1;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:16px Archivo,sans-serif;padding:0 12px}
.add{background:#14161a;color:#fff;border:0}
:root[data-theme=dark] .add{background:#eef0f3;color:#14161a}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .add{background:#eef0f3;color:#14161a}}
ol{list-style:none;margin:0;padding:0}
ol li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
ol li:first-child{border-top:0}
.n{flex:none;width:42px;height:42px;border-radius:10px;background:var(--bg);display:grid;place-items:center;font-weight:900}
li .who{flex:1}li .who b{display:block;font-size:17px;overflow-wrap:anywhere}li .who span{font-size:13px;color:var(--mut);white-space:nowrap}
.ic{flex:none;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;display:grid;place-items:center}
.empty{border:2px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--mut)}
.pill{background:var(--bg);border-radius:20px;padding:1px 9px;color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}
.stats b{display:block;font-size:24px;font-weight:900}.stats span{font-size:13px;color:var(--mut)}
details summary{cursor:pointer;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}td,th{padding:6px 4px;border-top:1px solid var(--line);text-align:left}td.r,th.r{text-align:right;white-space:nowrap}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#14161a;color:#fff;border-radius:12px;padding:10px 14px;display:none;gap:12px;align-items:center;z-index:9;max-width:92vw}
#toast button{background:none;border:0;color:#7fb0ff;font:700 15px Archivo,sans-serif;cursor:pointer}
#dlg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;place-items:center;z-index:10;padding:16px}
#dlg .card{width:min(420px,100%)}#dlg h3{margin:0 0 10px;font-size:20px}
.warn{background:#fff4d6;color:#5b4300;border-radius:12px;padding:10px 12px;font-size:14px;display:none}
</style>
</head>
<body>
<header><b>Fila<i>Voz</i></b><button class="hb" id="test">Testar voz</button><button class="hb" id="reset">Zerar dia</button></header>
<main>
  <section class="card" id="cur"></section>

  <div class="wrap"><button id="big" aria-label="Chamar próximo">CHAMAR<br>PRÓXIMO<small id="bigc">Fila vazia</small></button></div>

  <section class="card">
    <div class="lab"><span>Nova chegada</span><span>Passe o celular para o cliente</span></div>
    <div class="warn" id="nosr">Este navegador não reconhece voz. Use o Chrome no Android, num endereço https. Enquanto isso, digite o nome abaixo.</div>
    <button id="mic"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-2.1A7 7 0 0 0 19 12z"/></svg><span id="micl">FALAR O NOME</span></button>
    <p id="heard"></p>
    <form id="f"><input id="nm" placeholder="Ou digite o nome" autocomplete="off" enterkeyhint="done"><button class="btn add">+ Adicionar</button></form>
  </section>

  <section class="card">
    <div class="lab"><span>Fila de espera <span class="pill" id="qc">0</span></span><span>Ordem de chegada</span></div>
    <div id="q"></div>
  </section>

  <section class="card">
    <div class="stats" id="st"></div>
    <details style="margin-top:12px"><summary>Atendidos hoje</summary><div id="done"></div></details>
  </section>
</main>
<div id="toast"><span id="tmsg"></span><button id="tundo">Desfazer</button></div>
<div id="dlg"><div class="card"><h3 id="dt"></h3><div id="db"></div><div class="row" style="justify-content:flex-end"><button class="btn" id="dno">Cancelar</button><button class="btn add" id="dok">OK</button></div></div></div>

<script>
{
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hm=t=>new Date(t).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
const mins=ms=>{const m=Math.max(0,Math.round(ms/60000));return m<60?m+' min':Math.floor(m/60)+'h'+String(m%60).padStart(2,'0')};
const KEY='filavoz-v2';
let S={queue:[],cur:null,done:[],next:1,day:new Date().toDateString()};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.queue)S=s}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

/* ---------- voz (falar) ---------- */
let voice=null;
const pickVoice=()=>{const v=speechSynthesis.getVoices();voice=v.find(x=>/pt[-_]BR/i.test(x.lang)&&/google/i.test(x.name))||v.find(x=>/pt[-_]BR/i.test(x.lang))||v.find(x=>/^pt/i.test(x.lang))||null};
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function say(parts){
  if(!('speechSynthesis' in window))return;
  speechSynthesis.cancel();
  parts.forEach(t=>{const u=new SpeechSynthesisUtterance(t);u.lang='pt-BR';if(voice)u.voice=voice;u.rate=.9;u.volume=1;speechSynthesis.speak(u)});
}
let actx=null;
function chime(){
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    [[880,0],[660,.35]].forEach(([f,d])=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;o.type='sine';
      const t=actx.currentTime+d;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.6,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.6);
      o.connect(g).connect(actx.destination);o.start(t);o.stop(t+.65)})}catch(e){}
}
function announce(p){
  chime();
  const msg=`Senha ${p.n}. ${p.name}. Por favor, pode entrar.`;
  setTimeout(()=>say([msg,`Repetindo: ${p.name}, senha ${p.n}.`]),800);
}

/* ---------- ouvir (reconhecimento) ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,listening=false;
const clean=t=>{
  t=t.trim().replace(/[.,!?]+$/,'')
   .replace(/^(ol[aá],?\s*)?(o\s+)?(meu nome [eé]|me chamo|eu me chamo|eu sou( o| a)?|sou( o| a)?|aqui [eé]( o| a)?|[eé]( o| a)?)\s+/i,'');
  return t.split(/\s+/).map(w=>/^(da|de|do|das|dos|e)$/i.test(w)?w.toLowerCase():w.charAt(0).toUpperCase()+w.slice(1).toLowerCase()).join(' ').slice(0,60);
};
if(!SR){$('nosr').style.display='block';$('mic').style.display='none'}
else{
  rec=new SR();rec.lang='pt-BR';rec.interimResults=true;rec.maxAlternatives=1;rec.continuous=false;
  rec.onresult=e=>{let fin='',tmp='';for(const r of e.results){(r.isFinal?(fin+=r[0].transcript):(tmp+=r[0].transcript))}
    $('heard').textContent=(fin||tmp)?'Ouvi: '+(fin||tmp):'';
    if(fin){const n=clean(fin);if(n)addPerson(n,true)}};
  rec.onerror=e=>{$('heard').textContent=e.error==='not-allowed'||e.error==='service-not-allowed'?'Microfone bloqueado. Libere o microfone para este site nas configurações do navegador.':e.error==='no-speech'?'Não ouvi nada. Toque e fale de novo.':'Erro: '+e.error};
  rec.onend=()=>{listening=false;$('mic').classList.remove('on');$('micl').textContent='FALAR O NOME'};
}
$('mic').onclick=()=>{
  if(!rec)return;
  if(listening){rec.stop();return}
  speechSynthesis&&speechSynthesis.cancel();
  try{rec.start();listening=true;$('mic').classList.add('on');$('micl').textContent='OUVINDO... DIGA SEU NOME';$('heard').textContent=''}catch(e){}
};

/* ---------- fila ---------- */
let undoFn=null,tt=null;
function toast(msg,undo){$('tmsg').textContent=msg;undoFn=undo;$('tundo').style.display=undo?'':'none';$('toast').style.display='flex';clearTimeout(tt);tt=setTimeout(()=>$('toast').style.display='none',6000)}
$('tundo').onclick=()=>{if(undoFn)undoFn();undoFn=null;$('toast').style.display='none'};

function addPerson(name,spoken){
  const p={id:Date.now()+Math.random(),n:S.next++,name,t:Date.now()};
  S.queue.push(p);save();render();
  say([`${name}, sua senha é ${p.n}. Aguarde ser chamado.`]);
  toast(`Senha ${p.n}: ${name}${spoken?' (toque no lápis para corrigir)':''}`,()=>{S.queue=S.queue.filter(x=>x.id!==p.id);S.next--;save();render()});
}
$('f').onsubmit=e=>{e.preventDefault();const n=clean($('nm').value);if(!n)return;$('nm').value='';addPerson(n,false)};

function callNext(p){
  if(!p){say(['Não há ninguém na fila.']);toast('Fila vazia');return}
  if(S.cur)S.done.unshift({...S.cur,end:Date.now()});
  S.queue=S.queue.filter(x=>x.id!==p.id);
  S.cur={...p,called:Date.now()};save();render();announce(S.cur);
}
$('big').onclick=()=>callNext(S.queue[0]);

/* ---------- diálogo ---------- */
let dlgOk=null;
function dialog(title,html,ok){$('dt').textContent=title;$('db').innerHTML=html;dlgOk=ok;$('dlg').style.display='grid';const i=$('db').querySelector('input');if(i){i.focus();i.select()}}
$('dno').onclick=()=>$('dlg').style.display='none';
$('dok').onclick=()=>{$('dlg').style.display='none';if(dlgOk)dlgOk()};

$('q').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;
  const p=S.queue.find(x=>String(x.id)===b.dataset.id);if(!p)return;
  if(b.dataset.a==='edit')dialog('Corrigir nome',`<input id="en" value="${esc(p.name)}">`,()=>{const v=clean($('en').value);if(v){p.name=v;save();render()}});
  if(b.dataset.a==='del'){const i=S.queue.indexOf(p);S.queue.splice(i,1);save();render();toast(`${p.name} saiu da fila`,()=>{S.queue.splice(i,0,p);save();render()})}
  if(b.dataset.a==='call')callNext(p);
};
$('cur').onclick=e=>{
  const a=e.target.closest('button')?.dataset.a;if(!a||!S.cur)return;
  if(a==='again')announce(S.cur);
  if(a==='finish'){S.done.unshift({...S.cur,end:Date.now()});S.cur=null;save();render()}
};
$('test').onclick=()=>{chime();setTimeout(()=>say(['Teste de voz. Senha 1. Maria da Silva. Por favor, pode entrar.']),800)};
$('reset').onclick=()=>dialog('Zerar o dia?','<p style="margin:0">Apaga a fila, quem está em atendimento e o histórico de hoje, e volta a senha para 1.</p>',()=>{S={queue:[],cur:null,done:[],next:1,day:new Date().toDateString()};save();render()});

/* ---------- desenhar ---------- */
const ic={edit:'<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M3 17.2V21h3.8l11-11-3.8-3.8-11 11zM20.7 7a1 1 0 0 0 0-1.4l-2.3-2.3a1 1 0 0 0-1.4 0l-1.8 1.8 3.8 3.8L20.7 7z"/></svg>',
 del:'<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.4 17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z"/></svg>',
 call:'<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M3 10v4h4l5 5V5L7 10H3zm13.5 2A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/></svg>'};
function render(){
  const now=Date.now(),c=S.cur;
  $('cur').innerHTML=c?`<div class="lab"><span>Em atendimento agora</span><span class="tk">Senha ${c.n}</span></div>
    <div class="nm">${esc(c.name)}</div><div class="meta">Chegou ${hm(c.t)} · chamado ${hm(c.called)} · esperou ${mins(c.called-c.t)}</div>
    <div class="row"><button class="btn" data-a="again">Chamar de novo</button><button class="btn" data-a="finish">Encerrar atendimento</button></div>`
   :`<div class="lab"><span>Em atendimento agora</span></div><div class="nm" style="color:var(--mut);font-size:26px">Ninguém</div><div class="meta">Aperte o botão vermelho para chamar o primeiro da fila.</div>`;
  const q=S.queue;
  $('qc').textContent=q.length;
  $('bigc').textContent=q.length?`${q.length} na fila · próximo: ${q[0].name.split(' ')[0]}`:'Fila vazia';
  $('big').classList.toggle('off',!q.length);
  $('q').innerHTML=q.length?'<ol>'+q.map((p,i)=>`<li><span class="n">${p.n}</span><span class="who"><b>${esc(p.name)}</b><span>chegou ${hm(p.t)} · esperando ${mins(now-p.t)}${i===0?' · próximo':''}</span></span>
     <button class="ic" data-a="call" data-id="${p.id}" aria-label="Chamar agora">${ic.call}</button><button class="ic" data-a="edit" data-id="${p.id}" aria-label="Corrigir nome">${ic.edit}</button><button class="ic" data-a="del" data-id="${p.id}" aria-label="Remover">${ic.del}</button></li>`).join('')+'</ol>'
   :'<div class="empty">Ninguém aguardando.<br>Toque em <b>Falar o nome</b> quando alguém chegar.</div>';
  const d=S.done,avg=d.length?d.reduce((a,x)=>a+(x.called-x.t),0)/d.length:0;
  $('st').innerHTML=`<div><b>${d.length}</b><span>atendidos</span></div><div><b>${q.length}</b><span>na fila</span></div><div><b>${d.length?mins(avg):'—'}</b><span>espera média</span></div>`;
  $('done').innerHTML=d.length?`<table><tr><th>Senha</th><th>Nome</th><th class="r">Chegou</th><th class="r">Chamado</th><th class="r">Espera</th></tr>${d.map(x=>`<tr><td>${x.n}</td><td>${esc(x.name)}</td><td class="r">${hm(x.t)}</td><td class="r">${hm(x.called)}</td><td class="r">${mins(x.called-x.t)}</td></tr>`).join('')}</table>`:'<p style="color:var(--mut);margin:8px 0 0">Ainda ninguém atendido hoje.</p>';
}
render();setInterval(render,20000);

/* manter a tela acesa */
const wake=async()=>{try{if('wakeLock' in navigator)await navigator.wakeLock.request('screen')}catch(e){}};
wake();document.addEventListener('visibilitychange',()=>{if(!document.hidden)wake()});
}
</script>
</body>
</html>
